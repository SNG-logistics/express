# SNG Logistics — Auto Deploy
#
# ทุกครั้งที่ push เข้า main → SSH เข้าเซิร์ฟเวอร์ Hostinger/Plesk แล้วรัน
# `npm run deploy` (scripts/deploy.js ทำ git pull + npm install + migrate DB
# + restart Passenger ให้เองอยู่แล้ว จึงไม่ต้องสั่ง git pull ซ้ำที่นี่)
#
# ต้องตั้งค่า GitHub Secrets 4 ตัวก่อน (ตอนนี้เก็บไว้ใต้ Environment ชื่อ
# "SSH_HOST" — ดูบรรทัด `environment:` ด้านล่าง ต้องตรงกับชื่อนั้นเป๊ะ):
#     SSH_HOST      = IP หรือโดเมนของเซิร์ฟเวอร์
#     SSH_PORT      = พอร์ต SSH (เช่น 22)
#     SSH_USERNAME  = username จากหน้า Plesk "System user's credentials"
#     SSH_PASSWORD  = รหัสผ่านที่ตั้งในหน้าเดียวกัน (คนละตัวกับรหัส Plesk login)
#
# ไม่ต้องแก้ไฟล์นี้เพื่อใส่ค่าจริง — ค่าทั้งหมดอ่านจาก Secrets เท่านั้น

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # ปุ่ม "Run workflow" ไว้กด deploy ซ้ำเองได้ ไม่ต้อง push ใหม่

concurrency:
  group: deploy-production
  cancel-in-progress: false   # ห้ามยกเลิก deploy ที่กำลังรันอยู่กลางคัน — คิวต่อแทน

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SSH_HOST   # secrets ถูกเก็บไว้ใต้ environment นี้ ต้องระบุตรงนี้ถึงจะอ่านค่าได้
    steps:
      - name: SSH เข้าเซิร์ฟเวอร์แล้วรัน npm run deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          debug: true
          script: |
            echo "PWD: $(pwd)"
            echo "WHOAMI: $(whoami)"
            echo "PATH: $PATH"
            command -v node && node -v || echo "!! node not found in PATH"
            command -v npm  && npm -v  || echo "!! npm not found in PATH"
            cd ~/httpdocs || { echo "!! cd ~/httpdocs failed"; exit 1; }
            echo "IN: $(pwd)"
            ls -la | head -20
            npm run deploy
