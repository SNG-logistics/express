# SNG Logistics — CI
# Requires Node.js >= 20 (ESM + modern features)

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sng_logistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ""
      DB_NAME: sng_logistics
      SESSION_SECRET: ci_only_session_secret_at_least_32_chars

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run migrate-db
    - run: npm run lint
    - run: npm test
    - run: npm run test:db
    - run: npm run check-db
    - run: npm run check-crm
    - name: Syntax check
      run: >-
        find src scripts tests -type f \( -name '*.js' -o -name '*.mjs' \)
        -print0 | xargs -0 -n1 node --check

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/sng-scanner-android

    steps:
    - uses: actions/checkout@v4
    - name: Use Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
    - name: Build, unit test and lint Android scanner
      run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
